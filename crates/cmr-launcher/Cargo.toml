[package]
name = "cmr-launcher"
version = "0.9.1"
edition.workspace = true
# The settings window's eframe needs 1.95.
rust-version = "1.95"
license.workspace = true
description = "Runs the user's own copy of Colin McRae Rally (1998, PC) on modern Windows and under Proton/Wine"

[[bin]]
name = "CMRLauncher"
path = "src/main.rs"

[build-dependencies]
rea-launcher-build.workspace = true

[dependencies]
cmr-hdpack = { path = "../cmr-hdpack" }
rea-launcher.workspace = true

[target.'cfg(windows)'.dependencies]
rea-launcher-win32.workspace = true
rea-launcher-ui.workspace = true

[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
png = "0.18"
# The settings window is tested headless (egui_kittest), on the host and
# under Wine.
rea-launcher-ui = { workspace = true, features = ["testing"] }
# report's routing table (`audience`) is tested on the host too.
rea-launcher-win32.workspace = true
