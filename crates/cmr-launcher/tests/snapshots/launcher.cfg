# Colin McRae Rally launcher settings.
#
# One setting per line as key = value; lines starting with # are comments. A
# setting left unset keeps the game's own value (or the default named).
# Command-line options (--resolution 1920x1080, ...) override this file for
# one run. A launcher.cfg next to CMRLauncher.exe is used instead of this
# one when it exists (portable installs).

# The folder with your installed Rally.exe. It is only read, never changed.
# Remembered once given.
# Values: a folder or file.
#game =

# Where your saves and settings (cmRally.cfg, SAVESLOT*.cms) are kept:
# copied into the game before it starts and back when it ends. Default:
# Saved Games\Colin McRae Rally.
# Values: a folder or file.
#saves =

# Where the launcher keeps its private, writable copy of the game. Default:
# %LOCALAPPDATA%\CMRLauncher\Rally.
# Values: a folder or file.
#runtime =

# Advanced. The Language value the launcher seeds into the game's registry
# key when it is missing. The game picks and keeps its own language:
# rewriting the value later changes nothing.
# Values: ENGLISH, FRENCH, GERMAN, SPANISH or ITALIAN.
#language = ENGLISH

# Every picture setting at once: the game as it shipped, the screen's own
# size with every improvement, or the Steam Deck's screen. Picture settings
# given on their own win over it.
# Values: original, enhanced or steam_deck.
#look =

# The size races are drawn at, in place of the game's 640×480 (keep
# 640×480 in the game's own menu); the menus stay 640×480. Original keeps
# the game's sizes.
# Values: WIDTHxHEIGHT, original or off.
#resolution = 1920x1080

# On a 16:9 or wider race resolution, shows more to the sides instead of
# stretching the 4:3 picture.
# Values: on or off.
#widescreen =

# How far you see: every stage's view and object distances times this, 1.0
# to 3.0. Longer costs speed and can flicker far away.
# Values: 1.0 to 3.0.
#draw_distance = 1.5

# Smooth: the road and scenery don't shimmer in the distance. Sharp: crisp,
# unfiltered pixels. Original: the game's own.
# Values: original, smooth or sharp.
#texture_filter =

# The most frames a second the picture is redrawn (the driving keeps its own
# rate): smoother pacing, less heat and noise. Off: no cap.
# Values: 10 to 1000 or off.
#fps_limit = 60

# Waits for the screen's refresh before showing each frame: no tearing.
# Unset keeps the game's own choice.
# Values: on or off.
#vsync =

# Stages change their view distance from section to section at once, so
# scenery pops in; this eases each change over about a second.
# Values: on or off.
#smooth_distance =

# The race HUD, logos and menu pictures redrawn at high resolution: on uses
# the pack that comes with the launcher, or give a folder made with cmr-hd.
# Values: on, off or a folder.
#hd_art = on

# Linux only: how gamescope enlarges the picture to your screen. Crisp
# pixels: every game pixel a sharp block. Even pixels: sharp, all the same
# size. FSR: smoothed, then sharpened. Soft: plain smoothing (the default).
# Values: nearest, pixel, fsr or linear.
#scaler =

# Advanced; the look sets it. The triggers or the right stick work as
# throttle and brake, and Start pauses a race. Off (the Original look): only
# the left stick drives, as in 1998. On unless the look or this key says
# off.
# Values: on or off.
#gamepad_axes =

# The pad shakes on impacts, at this strength in percent. Needs an
# Xbox-style (XInput) pad. Off: none.
# Values: 0 to 100 or off.
#rumble = 60

# With rumble on, the triggers shake too: the right one when the wheels
# spin, the left one braking hard and pulsing when the wheels lock. Needs a
# pad with trigger motors (Xbox One or newer). On unless set off.
# Values: on or off.
#trigger_rumble =

# With rumble on, a faint buzz while driving, stronger on rough ground, and
# at the rev limiter. Off: only impacts, landings, bumps and gear changes
# shake the pad. On unless set off.
# Values: on or off.
#road_rumble =

# Modern (the default): A selects and is the handbrake, B goes back, Y
# changes the view, LB and RB change gear, Start pauses. Original: the 1998
# order. Or eight button numbers for select, back, change view, gear down,
# handbrake, gear up, (unused), pause.
# Values: original, modern or 8 button numbers.
#buttons = original

# Advanced. Closing the game window (Alt+F4, the window's close button)
# quits the game, in every look. Off: the 1998 behaviour, where closing does
# nothing. On unless set off.
# Values: on or off.
#close_quits =
