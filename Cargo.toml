[workspace]
members = ["crates/cmr-assets", "crates/cmr-formats"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

