[workspace]
members = ["crates/cmr-launcher", "crates/cmr-hooks", "crates/cmr-hd", "crates/cmr-hdpack"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
sha2 = "0.11.1"
windows-sys = "0.61"
# The shared launcher SDK; bump the tag here and rerun scripts/sdk-sync.
rea-launcher = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.3.3" }
rea-launcher-win32 = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.3.3" }
rea-launcher-ui = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.3.3" }

[profile.release.package.cmr-hooks]
# The front end's HD compositor runs per screen pixel (fe_compose).
opt-level = 3

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
strip = true
