name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The SDL-free portable compatibility slice (no system SDL3 required).
  PORTABLE_SLICE: >-
    -p cmr-core -p cmr-formats -p cmr-test-support -p cmr-assets -p cmr-video

jobs:
  # Format, lint, and test the portable slice. Needs no SDL3, so it is the fast
  # gate that fails first on the common mistakes.
  portable-gate:
    name: Portable slice (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (portable slice)
        run: cargo clippy ${{ env.PORTABLE_SLICE }} --all-targets -- -D warnings
      - name: Test (portable slice)
        run: cargo test ${{ env.PORTABLE_SLICE }}

  # Prove the portable slice still type-checks for a Windows target. Mirrors the
  # locally verified `cargo check --target x86_64-pc-windows-gnu` (type-check
  # only; no mingw linker needed).
  windows-cross-check:
    name: Windows cross-check (portable slice)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Cross-check for Windows
        run: cargo check --target x86_64-pc-windows-gnu ${{ env.PORTABLE_SLICE }} --all-targets

  # Full workspace including the SDL3 host crates. SDL3 is built from source via
  # the bundled-sdl3 feature so the job needs no pre-installed SDL3 - only CMake
  # and a C toolchain (present on the GitHub-hosted runners).
  full-workspace:
    name: Full workspace with SDL3 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (full workspace, bundled SDL3)
        run: cargo clippy --workspace --all-targets --features cmr-platform-sdl3/bundled-sdl3 -- -D warnings
      - name: Test (full workspace, bundled SDL3)
        run: cargo test --workspace --features cmr-platform-sdl3/bundled-sdl3
