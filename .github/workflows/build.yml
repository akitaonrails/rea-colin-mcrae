name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-binaries:
    name: Test and build the Windows package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the 32-bit MinGW toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686 zip

      - name: Install Rust (with the 32-bit Windows target)
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup target add i686-pc-windows-gnu

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Unit tests (host)
        run: cargo test --workspace

      - name: Lint (Windows target)
        run: cargo clippy --release --target i686-pc-windows-gnu --workspace -- -D warnings

      - name: Build CMRLauncher.exe and cmrhooks.dll
        run: cargo build --release --target i686-pc-windows-gnu --workspace

      - name: Package
        run: |
          name=CMRLauncher-${GITHUB_REF_NAME//\//-}
          mkdir -p "dist/$name"
          cp target/i686-pc-windows-gnu/release/CMRLauncher.exe \
             target/i686-pc-windows-gnu/release/cmrhooks.dll \
             README.md THIRD_PARTY.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cp -r linux "dist/$name/linux"
          (cd dist && zip -r "$name.zip" "$name")
          echo "PACKAGE=dist/$name.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: CMRLauncher-windows
          path: ${{ env.PACKAGE }}

  release:
    name: Publish a release for version tags
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: CMRLauncher-windows
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes ./*.zip
