name: build

# Checks, the Windows build and both packages through the SDK's reusable
# workflows (rea-launcher-sdk, pinned by tag; sdk/VERSION must match);
# version tags publish a release with the tag's CHANGELOG section.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  # The shared rea-launcher-sdk CI: formatting, host tests, cargo audit and
  # deny, sdk/ drift, shell syntax and the Linux helper and packaging tests,
  # Windows-target clippy, the release build (CMRLauncher.exe, cmrhooks.dll
  # and the cmr-hd study tool), the import check, the Windows-target tests
  # under Wine (headless), packaging and the package allowlist
  # (sdk/docs/playbooks/ci-and-releases.md).
  ci:
    uses: akitaonrails/rea-launcher-sdk/.github/workflows/launcher-ci.yml@v0.4.1
    with:
      rust-target: i686-pc-windows-gnu
      # MinGW links the exe and the hook DLL, and compiles cmr-hd's libwebp
      # for the Windows target; zip/unzip for the package and the HD pack.
      apt-packages: gcc-mingw-w64-i686 lld zip unzip
      # The library and binaries, as before the SDK (the hook DLL is no_std
      # on Windows; its tests run on the host).
      clippy-args: ""
      wine-tests: true
      # cmr-hooks is no_std on Windows: its tests only build for the host.
      wine-test-args: --locked --workspace --exclude cmr-hooks
      package-command: packaging/package.sh "dist/CMRLauncher-$REA_VERSION_NAME"
      package-dir: dist/CMRLauncher-*/ dist/CMRLauncher-*.zip
      package-allowlist: packaging/package.allow
      artifact-name: CMRLauncher-packages
      artifact-paths: |
        dist/*.zip
        dist/*.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    # All three, even with attest: false (GitHub checks a called workflow's
    # permissions before any if:).
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: akitaonrails/rea-launcher-sdk/.github/workflows/launcher-release.yml@v0.4.1
    with:
      package: cmr-launcher
      artifact-pattern: CMRLauncher-*
